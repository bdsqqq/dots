packages:
  - packages/core/*
  - packages/extensions/*
  - packages/optional/*

patchedDependencies:
  "@earendil-works/gondolin@0.7.0": patches/gondolin-0.7.0.patch
  "@letta-ai/trajectory@0.2.1": patches/letta-ai-trajectory-0.2.1.patch
  "remend@1.3.0": patches/remend-1.3.0.patch

catalog:
  "@earendil-works/pi-ai": ^0.82.0
  "@earendil-works/pi-coding-agent": ^0.82.0
  "@earendil-works/pi-tui": ^0.82.0
  typebox: ^1.1.38

allowBuilds:
  "@google/genai": true
  cpu-features: false
  esbuild: true
  koffi: true
  protobufjs: true
  ssh2: false
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true

# Remove after Pi 0.82.0 clears the 48-hour release-age policy.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@0.82.0"
  - "@earendil-works/pi-ai@0.82.0"
  - "@earendil-works/pi-coding-agent@0.82.0"
  - "@earendil-works/pi-tui@0.82.0"

overrides:
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  defu@<=6.1.4: 6.1.5
  undici@>=6.0.0 <6.28.0: 6.28.0
  undici@>=7.0.0 <7.29.0: 7.29.0
  undici@>=8.0.0 <8.9.0: 8.9.0
