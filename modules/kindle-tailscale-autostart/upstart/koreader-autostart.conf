description "Open KOReader after the Kindle UI is ready"

start on stopped lab126_gui_setup
stop on (stopping lab126_gui or ota-update)

script
    . /etc/upstart/env
    [ ! -e /mnt/us/koreader/DISABLE_AUTOSTART ] || exit 0
    [ -x /mnt/us/koreader/koreader.sh ] || exit 0
    pidof reader.lua >/dev/null 2>&1 && exit 0
    exec /mnt/us/koreader/koreader.sh --kual
end script
