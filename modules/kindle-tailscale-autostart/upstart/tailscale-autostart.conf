description "Reconnect the enrolled Kindle to Tailscale"

start on started volumd
stop on (stopping volumd or ota-update)

task

script
    base=/mnt/us/extensions/tailscale-autostart
    [ ! -e "$base/disabled" ] || exit 0
    [ -x "$base/bin/ensure-tailscale.sh" ] || exit 0
    mkdir -p /mnt/us/tailscale-autostart
    exec timeout 75 "$base/bin/ensure-tailscale.sh" >>/mnt/us/tailscale-autostart/boot.log 2>&1
end script
