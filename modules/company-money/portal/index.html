<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>money</title>
  <link rel="stylesheet" href="/portal.css">
  <script src="/portal.js" defer></script>
</head>
<body><main>
  <header><h1>money</h1><button id="refresh" type="button">refresh</button></header>
  <p id="entity">nubank · company account</p>
  <p id="status" role="status">loading ledger…</p>
  <section id="totals" aria-label="money in, out, and net movement"></section>
  <p class="note">completed movements in the imported statements, including unclassified money and transfers. net movement is not your bank balance or profit.</p>
  <div class="table-wrap"><table>
    <caption>transactions</caption>
    <thead><tr><th scope="col">date</th><th scope="col">description</th><th scope="col">classification / status</th><th scope="col" class="amount">amount</th></tr></thead>
    <tbody id="transactions"></tbody>
  </table></div>
  <noscript>javascript is required to load the private tally.</noscript>
</main></body>
</html>
