# Keep uosc close to its maintained defaults, with slightly roomier controls
# and softer geometry for high-density displays.
timeline_size=40
progress=windowed
progress_size=2
controls_size=32
controls_margin=10
controls_spacing=3
top_bar=no-border
top_bar_controls=right
window_border_size=0
border_radius=8
animation_duration=120
proximity_in=48
proximity_out=128
subtitles_directory=~/Downloads
