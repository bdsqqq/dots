name: import Tailscale policy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Import active policy
        env:
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          TS_OAUTH_ID: ${{ vars.TS_OAUTH_ID }}
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail

          id_token="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TS_AUDIENCE}" |
              jq --exit-status --raw-output '.value'
          )"
          api_token="$(
            curl --fail --silent --show-error \
              -X POST \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=${TS_OAUTH_ID}" \
              --data-urlencode "jwt=${id_token}" \
              https://api.tailscale.com/api/v2/oauth/token-exchange |
              jq --exit-status --raw-output '.access_token'
          )"

          mkdir -p tailscale
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${api_token}" \
            -H "Accept: application/hujson" \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/acl" \
            >tailscale/policy.hujson

      - uses: actions/upload-artifact@v4
        with:
          name: active-tailscale-policy
          path: tailscale/policy.hujson
          if-no-files-found: error
          retention-days: 1
