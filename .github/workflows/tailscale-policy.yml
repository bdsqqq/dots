name: sync Tailscale policy

on:
  push:
    branches: [main]
    paths:
      - .sops.yaml
      - tailscale/capabilities.json
      - tailscale/machines.json
      - tailscale/policy.hujson
      - tailscale/services.json
      - tailscale/secrets/connectors/*.yaml
      - tailscale/secrets/machines/*.yaml
      - .github/workflows/tailscale-policy.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: tailscale-policy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Validate machine bootstrap declarations
        run: |
          jq -e '
            (.recoveryRecipients | type == "array" and length > 0 and
              all(.[]; test("^age1[0-9a-z]+$"))) and
            (.machines | type == "object" and length > 0) and
            all(.machines | to_entries[];
              (.key | test("^[a-z0-9][a-z0-9-]*$")) and
              (.value.ageRecipients | type == "array" and length > 0 and
                all(.[]; test("^age1[0-9a-z]+$"))) and
              (.value.bootstrapGeneration |
                type == "number" and . > 0 and floor == .) and
              (.value.tag | test("^tag:[a-z0-9-]+$"))
            )
          ' tailscale/machines.json >/dev/null

      - name: Reject stale revisions
        run: |
          set -euo pipefail
          current="$(
            git ls-remote https://github.com/bdsqqq/dots.git refs/heads/main |
              cut -f1
          )"
          if [[ "${GITHUB_SHA}" != "${current}" ]]; then
            echo "Refusing to apply stale policy ${GITHUB_SHA}; main is ${current}."
            exit 1
          fi

      - name: Exchange GitHub identity for a Tailscale API token
        env:
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          TS_OAUTH_ID: ${{ vars.TS_OAUTH_ID }}
        run: |
          set -euo pipefail
          id_token="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TS_AUDIENCE}" |
              jq -er '.value'
          )"
          exchange_response="$(
            curl --fail-with-body --silent --show-error \
              --data-urlencode "client_id=${TS_OAUTH_ID}" \
              --data-urlencode "jwt=${id_token}" \
              https://api.tailscale.com/api/v2/oauth/token-exchange
          )"
          api_token="$(jq -er '.access_token' <<< "${exchange_response}")"
          echo "::add-mask::${api_token}"
          jq '{scope, tags}' <<< "${exchange_response}"
          echo "TS_API_TOKEN=${api_token}" >> "${GITHUB_ENV}"

      - name: Define Tailscale services
        id: services
        continue-on-error: true
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          tailnet="$(jq -rn --arg value "${TS_TAILNET}" '$value | @uri')"

          jq -r 'keys[]' tailscale/services.json | while read -r service; do
            encoded_service="$(jq -rn --arg value "${service}" '$value | @uri')"
            url="https://api.tailscale.com/api/v2/tailnet/${tailnet}/vip-services/${encoded_service}"
            status="$(
              curl --silent --show-error \
                -H "Authorization: Bearer ${TS_API_TOKEN}" \
                -o current-service.json \
                -w '%{http_code}' \
                "${url}"
            )"

            case "${status}" in
              200)
                jq --arg service "${service}" \
                  '. as $current | input | $current * .[$service] | .name = $service' \
                  current-service.json tailscale/services.json \
                  > desired-service.json
                ;;
              404)
                jq --arg service "${service}" \
                  '.[$service] + {name: $service}' \
                  tailscale/services.json \
                  > desired-service.json
                ;;
              *)
                cat current-service.json >&2
                exit 1
                ;;
            esac

            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer ${TS_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @desired-service.json \
              "${url}"
          done

      - name: Validate and apply policy
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          action: apply
          audience: ${{ vars.TS_AUDIENCE }}
          oauth-client-id: ${{ vars.TS_OAUTH_ID }}
          policy-file: tailscale/policy.hujson
          tailnet: ${{ vars.TS_TAILNET }}

      - name: Require service reconciliation
        if: steps.services.outcome != 'success'
        run: |
          echo "The Tailscale identity needs the services write scope." >&2
          exit 1

      - name: Provision missing connector auth keys
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          tailnet="$(jq -rn --arg value "${TS_TAILNET}" '$value | @uri')"
          created=()

          while IFS=$'\t' read -r trust tag; do
            secret="tailscale/secrets/connectors/${trust}.yaml"
            if [[ -s "${secret}" ]]; then
              continue
            fi

            description="dots-connector-${trust}"
            keys_url="https://api.tailscale.com/api/v2/tailnet/${tailnet}/keys"
            keys="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${TS_API_TOKEN}" \
                "${keys_url}"
            )"

            while read -r key_id; do
              metadata="$(
                curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  "${keys_url}/${key_id}"
              )"
              if jq -e \
                --arg description "${description}" \
                --arg tag "${tag}" \
                '.description == $description and
                 (.capabilities.devices.create.tags // []) == [$tag]' \
                <<< "${metadata}" >/dev/null
              then
                curl --fail-with-body --silent --show-error \
                  -X DELETE \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  "${keys_url}/${key_id}"
              fi
            done < <(
              jq -r '
                if type == "array" then .[]?.id
                else (.keys // .authKeys // [])[]?.id
                end
              ' <<< "${keys}"
            )

            response="$(mktemp)"
            status="$(
              jq -n \
                --arg description "${description}" \
                --arg tag "${tag}" \
                '{
                  capabilities: {
                    devices: {
                      create: {
                        reusable: true,
                        ephemeral: false,
                        preauthorized: true,
                        tags: [$tag]
                      }
                    }
                  },
                  expirySeconds: 7776000,
                  description: $description
                }' |
                curl --silent --show-error \
                  -X POST \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  "${keys_url}"
            )"
            if [[ ! "${status}" =~ ^2[0-9][0-9]$ ]]; then
              jq -r '.message // .error // "Tailscale rejected the auth key"' \
                "${response}" >&2
              rm "${response}"
              exit 1
            fi
            auth_key="$(jq -er '.key' "${response}")"
            rm "${response}"
            echo "::add-mask::${auth_key}"
            mkdir -p "$(dirname "${secret}")"
            encrypted="$(mktemp)"
            export AUTH_KEY="${auth_key}"
            jq -n '{authKey: env.AUTH_KEY}' |
              nix shell nixpkgs#sops --command sops encrypt \
                --filename-override "${secret}" \
                --input-type json \
                --output-type yaml \
                /dev/stdin \
                > "${encrypted}"
            unset AUTH_KEY auth_key
            install -m 0600 "${encrypted}" "${secret}"
            rm "${encrypted}"
            created+=("${secret}")
          done < <(
            jq -r '.connectorTags | to_entries[] | [.key, .value] | @tsv' \
              tailscale/capabilities.json
          )

          if (( ${#created[@]} == 0 )); then
            exit 0
          fi

          git add "${created[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(tailscale): provision connector auth keys [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Provision machine bootstrap auth keys
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          tailnet="$(jq -rn --arg value "${TS_TAILNET}" '$value | @uri')"
          keys_url="https://api.tailscale.com/api/v2/tailnet/${tailnet}/keys"
          created=()

          while IFS=$'\t' read -r machine generation tag recipients; do
            secret="tailscale/secrets/machines/${machine}.yaml"
            current_generation="$(
              sed -n 's/^bootstrapGeneration_unencrypted: //p' "${secret}" 2>/dev/null || true
            )"
            if [[ "${current_generation}" == "${generation}" ]]; then
              continue
            fi

            description="dots-machine-${machine}-bootstrap-${generation}"
            keys="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${TS_API_TOKEN}" \
                "${keys_url}"
            )"
            while read -r key_id; do
              metadata="$(
                curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  "${keys_url}/${key_id}"
              )"
              if jq -e --arg description "${description}" \
                '.description == $description' <<< "${metadata}" >/dev/null
              then
                curl --fail-with-body --silent --show-error \
                  -X DELETE \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  "${keys_url}/${key_id}"
              fi
            done < <(
              jq -r '
                if type == "array" then .[]?.id
                else (.keys // .authKeys // [])[]?.id
                end
              ' <<< "${keys}"
            )

            response="$(mktemp)"
            status="$(
              jq -n \
                --arg description "${description}" \
                --arg tag "${tag}" \
                '{
                  capabilities: {
                    devices: {
                      create: {
                        reusable: false,
                        ephemeral: false,
                        preauthorized: true,
                        tags: [$tag]
                      }
                    }
                  },
                  expirySeconds: 604800,
                  description: $description
                }' |
                curl --silent --show-error \
                  -X POST \
                  -H "Authorization: Bearer ${TS_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  --output "${response}" \
                  --write-out '%{http_code}' \
                  "${keys_url}"
            )"
            if [[ ! "${status}" =~ ^2[0-9][0-9]$ ]]; then
              jq -r '.message // .error // "Tailscale rejected the auth key"' \
                "${response}" >&2
              rm "${response}"
              exit 1
            fi

            auth_key="$(jq -er '.key' "${response}")"
            rm "${response}"
            echo "::add-mask::${auth_key}"
            mkdir -p "$(dirname "${secret}")"
            encrypted="$(mktemp)"
            export AUTH_KEY="${auth_key}"
            jq -n --argjson generation "${generation}" \
              '{
                authKey: env.AUTH_KEY,
                bootstrapGeneration_unencrypted: $generation
              }' |
              nix shell nixpkgs#sops --command sops --config /dev/null encrypt \
                --age "${recipients}" \
                --unencrypted-suffix _unencrypted \
                --filename-override "${secret}" \
                --input-type json \
                --output-type yaml \
                /dev/stdin \
                > "${encrypted}"
            unset AUTH_KEY auth_key
            install -m 0600 "${encrypted}" "${secret}"
            rm "${encrypted}"
            created+=("${secret}")
          done < <(
            jq -r '
              .recoveryRecipients as $recovery |
              .machines | to_entries[] |
              [
                .key,
                (.value.bootstrapGeneration | tostring),
                .value.tag,
                (($recovery + .value.ageRecipients) | join(","))
              ] | @tsv
            ' tailscale/machines.json
          )

          if (( ${#created[@]} == 0 )); then
            exit 0
          fi

          git add "${created[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(tailscale): provision machine bootstrap keys [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
