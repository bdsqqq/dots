name: sync Cloudflare control plane

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**.tf"
      - "cloudflare/apps.auto.tfvars.json"
      - "cloudflare/.terraform.lock.hcl"
      - ".github/workflows/cloudflare.yml"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-control-plane
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7c1219e69201df160c85fc5e030efe36
      CLOUDFLARE_HTML_STUFF_TUNNEL_SECRET: ${{ secrets.CLOUDFLARE_HTML_STUFF_TUNNEL_SECRET }}
      CLOUDFLARE_T3_TUNNEL_SECRET: ${{ secrets.CLOUDFLARE_T3_TUNNEL_SECRET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_family_emails: ${{ secrets.CLOUDFLARE_FAMILY_EMAILS }}
      TF_VAR_owner_email: ${{ secrets.CLOUDFLARE_OWNER_EMAIL }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        if: github.event_name != 'schedule'

      - name: Prepare available tunnel bootstrap secrets
        run: |
          set -euo pipefail
          tunnel_secrets="$(
            jq -cn \
              --arg html_stuff "${CLOUDFLARE_HTML_STUFF_TUNNEL_SECRET}" \
              --arg t3 "${CLOUDFLARE_T3_TUNNEL_SECRET}" \
              '{"html-stuff": $html_stuff, t3: $t3}
               | with_entries(select(.value != ""))'
          )"
          echo "TF_VAR_tunnel_secrets=${tunnel_secrets}" >> "${GITHUB_ENV}"

      - name: Reject stale revisions
        if: github.event_name != 'schedule'
        working-directory: .
        run: |
          set -euo pipefail
          current="$(
            git ls-remote https://github.com/bdsqqq/dots.git refs/heads/main |
              cut -f1
          )"
          if [[ "${GITHUB_SHA}" != "${current}" ]]; then
            echo "Refusing to apply stale Cloudflare config ${GITHUB_SHA}; main is ${current}."
            exit 1
          fi

      - run: tofu init

      - name: Require committed encrypted state
        run: |
          test -s terraform.tfstate

      - name: Plan
        id: plan
        run: |
          set +e
          tofu plan -detailed-exitcode -out=cloudflare.tfplan
          status=$?
          set -e

          case "${status}" in
            0) echo "changes=false" >> "${GITHUB_OUTPUT}" ;;
            2) echo "changes=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

      - name: Reject destructive plans
        run: |
          set -euo pipefail
          tofu show -json cloudflare.tfplan > cloudflare.tfplan.json
          destructive="$(
            jq '[
              .resource_changes[]? |
              select(.change.actions | index("delete")) |
              .address
            ]' cloudflare.tfplan.json
          )"
          if [[ "${destructive}" != "[]" ]]; then
            echo "Refusing a plan that deletes or replaces Cloudflare resources:" >&2
            jq -r '.[]' <<< "${destructive}" >&2
            exit 1
          fi

      - name: Report drift
        if: github.event_name == 'schedule' && steps.plan.outputs.changes == 'true'
        run: |
          echo "Cloudflare differs from the committed declaration." >&2
          exit 1

      - name: Apply
        if: github.event_name != 'schedule' && steps.plan.outputs.changes == 'true'
        run: tofu apply cloudflare.tfplan

      - name: Require convergence
        if: github.event_name != 'schedule'
        run: tofu plan -detailed-exitcode

      - name: Report connector identifiers
        if: github.event_name != 'schedule'
        run: tofu output

      - name: Write applied runtime bindings
        if: github.event_name != 'schedule'
        run: tofu output -json runtime_bindings > runtime-bindings.json

      - name: Encrypt new tunnel credentials
        if: github.event_name != 'schedule'
        working-directory: .
        run: |
          set -euo pipefail
          secret=cloudflare/secrets/t3.yaml
          if [[ -s "${secret}" || -z "${CLOUDFLARE_T3_TUNNEL_SECRET}" ]]; then
            exit 0
          fi

          tunnel_id="$(jq -er '.t3.tunnelId' cloudflare/runtime-bindings.json)"
          credential="$(
            jq -cn \
              --arg account "${CLOUDFLARE_ACCOUNT_ID}" \
              --arg id "${tunnel_id}" \
              --arg tunnel_secret "${CLOUDFLARE_T3_TUNNEL_SECRET}" \
              '{
                AccountTag: $account,
                TunnelID: $id,
                TunnelSecret: $tunnel_secret,
                Endpoint: ""
              }'
          )"
          mkdir -p "$(dirname "${secret}")"
          encrypted="$(mktemp)"
          jq -n --arg credential "${credential}" '{credential: $credential}' |
            nix shell nixpkgs#sops --command sops encrypt \
              --filename-override cloudflare/secrets/t3.yaml \
              --input-type json \
              --output-type yaml \
              /dev/stdin \
              > "${encrypted}"
          install -m 0600 "${encrypted}" "${secret}"
          rm "${encrypted}"

      - name: Commit encrypted state and applied bindings
        if: github.event_name != 'schedule'
        working-directory: .
        run: |
          set -euo pipefail
          git add \
            cloudflare/runtime-bindings.json \
            cloudflare/terraform.tfstate
          if [[ -s cloudflare/secrets/t3.yaml ]]; then
            git add cloudflare/secrets/t3.yaml
          fi
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(cloudflare): update encrypted state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
