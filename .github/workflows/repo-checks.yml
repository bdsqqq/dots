name: repo checks

# flake checks only fail when something builds them, so build every one on
# every change instead of relying on local `nix flake check`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # signed media URLs (yt-dlp dumps etc.) embed the requester's address as
      # `ip=`; only the anonymous or redacted forms may be committed.
      - name: reject committed client addresses
        run: |
          # -o: minified JSON keeps every URL on one line, so compare each match.
          # separators may be raw, HTML (&amp;) or JSON (\u0026) escaped.
          if git grep -nIoE '([?&;]|\\u0026)ip=[^&"'"'"'\\)#<[:space:]]+' -- . | grep -vE 'ip=(0\.0\.0\.0|REDACTED)$'; then
            echo 'a committed URL carries a client ip= parameter; redact it to ip=REDACTED' >&2
            exit 1
          fi

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # every check, enumerated: a new check runs here without editing this file.
      - name: build every x86_64-linux flake check
        run: |
          set -euo pipefail
          mapfile -t checks < <(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
          echo "checks: ${checks[*]}"
          nix build --no-link --keep-going "${checks[@]/#/.#checks.x86_64-linux.}"
