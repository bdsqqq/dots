name: repo checks

# credential-host-closures pins each host's sops secret set; it only fails when
# something builds it, so run it on every change instead of relying on local
# `nix flake check`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # signed media URLs (yt-dlp dumps etc.) embed the requester's address as
      # `ip=`; only the anonymous or redacted forms may be committed.
      - name: reject committed client addresses
        run: |
          # -o: minified JSON keeps every URL on one line, so compare each match.
          # separators may be raw, HTML (&amp;) or JSON (\u0026) escaped.
          if git grep -nIoE '([?&;]|\\u0026)ip=[^&"'"'"'\\)#<[:space:]]+' -- . | grep -vE 'ip=(0\.0\.0\.0|REDACTED)$'; then
            echo 'a committed URL carries a client ip= parameter; redact it to ip=REDACTED' >&2
            exit 1
          fi

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - run: >-
          nix build --no-link
          .#checks.x86_64-linux.credential-host-closures
          .#checks.x86_64-linux.credential-ownership
