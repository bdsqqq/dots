name: publish @bdsqqq/pi

on:
  push:
    branches: [main]
    paths:
      - "modules/pi/packages/**/*.ts"
      - "!modules/pi/packages/**/*.test.ts"
      - "modules/pi/src/**"
      - "modules/pi/tsdown.config.ts"
      - "modules/pi/tsconfig.build.json"
      - "modules/pi/package.json"
      - "modules/pi/pnpm-lock.yaml"
  # PRs run only the test job, so failures show on the PR instead of after
  # the merge.
  pull_request:
    paths:
      - "modules/pi/**"
      - ".github/workflows/publish-pi.yml"
  workflow_dispatch:

concurrency:
  group: publish-pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pi
    # PR code runs here, so it gets no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: modules/pi/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: install shell test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: test
        # Memory tests already spawn real concurrent subprocesses; bound outer
        # workers to the same budget as local verification on the shared runner.
        run: pnpm exec vitest run --maxWorkers=2 --exclude 'packages/extensions/github/**'
        env:
          GH_TOKEN: ${{ github.token }}
          PI_TEST_BUILT_TOOLS: "1"

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pi
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: modules/pi/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: set epoch version
        id: version
        run: |
          TIMESTAMP=$(date +%s)
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION="0.0.${TIMESTAMP}-g${GIT_HASH}"
          echo "Publishing @bdsqqq/pi@${VERSION}"
          npm version "${VERSION}" --no-git-tag-version

      - name: publish
        run: npm publish --access public --tag latest --provenance
