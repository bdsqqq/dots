name: publish @bdsqqq/pi

on:
  push:
    branches: [main]
    paths:
      - "modules/pi/packages/**/*.ts"
      - "!modules/pi/packages/**/*.test.ts"
      - "modules/pi/src/**"
      - "modules/pi/tsdown.config.ts"
      - "modules/pi/tsconfig.build.json"
      - "modules/pi/package.json"
      - "modules/pi/pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: publish-pi
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pi
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: modules/pi/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: install shell test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: test
        # Memory tests already spawn real concurrent subprocesses; bound outer
        # workers to the same budget as local verification on the shared runner.
        run: pnpm exec vitest run --maxWorkers=2 --exclude 'packages/extensions/github/**'
        env:
          GH_TOKEN: ${{ github.token }}
          PI_TEST_BUILT_TOOLS: "1"

      - name: set epoch version
        id: version
        run: |
          TIMESTAMP=$(date +%s)
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION="0.0.${TIMESTAMP}-g${GIT_HASH}"
          echo "Publishing @bdsqqq/pi@${VERSION}"
          npm version "${VERSION}" --no-git-tag-version

      - name: publish
        run: npm publish --access public --tag latest --provenance
