name: module tests

# module tests ran nowhere before this workflow; scripts/module-tests.ts picks
# up new test files by default.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: module-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # modules/html-stuff tests import bun: modules.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # some tests evaluate this flake's modules with nix.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # agents, gog and cli-proxy-api tests load the pi SDK from modules/pi.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: modules/pi

      - run: node --experimental-strip-types --test scripts/module-tests.test.ts

      - run: node --experimental-strip-types scripts/module-tests.ts

      # repo-checks builds linux flake checks; darwin-only ones build here.
      - name: build darwin-only flake checks
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          names=$(nix eval --json .#checks.aarch64-darwin --apply 'cs: builtins.attrNames (removeAttrs cs (builtins.attrNames (builtins.getFlake (toString ./.)).checks.x86_64-linux))' --impure | jq -r '.[]')
          [ -n "$names" ] || { echo 'no darwin-only flake checks found' >&2; exit 1; }
          mapfile -t checks <<<"$names"
          echo "checks: ${checks[*]}"
          nix build --no-link --keep-going "${checks[@]/#/.#checks.aarch64-darwin.}"
