name: module tests

# module tests ran nowhere before this workflow; scripts/module-tests.ts picks
# up new test files by default.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: module-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # some tests evaluate this flake's modules with nix.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: node --experimental-strip-types --test scripts/module-tests.test.ts

      - run: node --experimental-strip-types scripts/module-tests.ts
