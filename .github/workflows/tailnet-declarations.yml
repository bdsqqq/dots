name: validate tailnet declarations

on:
  push:
    branches: [main]
    paths:
      - "modules/**/tailnet-app.nix"
      - "modules/tailnet/catalog.nix"
      - "modules/tailnet/generate-artifacts.py"
      - "generated/fleet-apps.json"
      - "cloudflare/apps.auto.tfvars.json"
      - "tailscale/capabilities.json"
      - "tailscale/services.json"
      - "tailscale/policy.hujson"
      - "flake.nix"
      - ".github/workflows/tailnet-declarations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix build .#checks.x86_64-linux.tailnet-artifacts
