name: validate tailnet declarations

on:
  push:
    branches: [main]
    paths:
      - "modules/**/tailnet-app.nix"
      - "user/**/tailnet-app.nix"
      - "system/tailnet-apps.nix"
      - "scripts/generate-tailnet-artifacts.py"
      - "generated/fleet-apps.json"
      - "cloudflare/apps.auto.tfvars.json"
      - "tailscale/capabilities.json"
      - "tailscale/services.json"
      - "tailscale/policy.hujson"
      - "flake.nix"
      - ".github/workflows/tailnet-declarations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - run: nix build .#checks.x86_64-linux.tailnet-artifacts
