name: update tack pins

on:
  schedule:
    - cron: '0 9 * * 1'  # mondays 9am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # inputs are pinned by tack (.tack/pins.toml), not flake.lock. frozen pins stay put.
      # run the tack revision hosts install (the locked pin), not upstream HEAD, so
      # the code that writes the lock only changes in a reviewed update.
      - name: update pins with the locked tack
        run: |
          rev=$(jq -r .tack.rev .tack/pins.lock.json)
          nix run --accept-flake-config "github:manic-systems/tack/$rev" -- update

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore(nix): update tack pins"
          title: "chore(nix): update tack pins"
          body: |
            automated `tack update` of .tack/pins.lock.json.
            
            run `tack look -v` and `nix flake check` locally before merging.
          branch: tack-update
          delete-branch: true
