name: update flake inputs

on:
  schedule:
    - cron: '0 9 * * 1'  # mondays 9am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix flake update

      # flake.nix is generated from flake-file.nix and modules/*/flake-file.nix.
      # a flake-file or formatter bump can change its bytes, so regenerate it
      # in the same PR instead of leaving check-flake-file red.
      - run: nix run .#write-flake

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore(nix): update flake inputs"
          title: "chore(nix): update flake inputs"
          body: |
            automated flake.lock update.
            
            run `nix flake check` locally before merging.
          branch: flake-update
          delete-branch: true
