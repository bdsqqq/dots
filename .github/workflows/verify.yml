name: verify merge candidate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA (empty uses the candidate parent)
        type: string
      bootstrap:
        description: Use candidate policy for the initial, manually reviewed installation
        type: boolean
        default: false

# Candidate code runs only on disposable hosted VMs, without deployment credentials.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.revision.outputs.base }}
      head: ${{ steps.revision.outputs.head }}
      policy: ${{ steps.revision.outputs.policy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - id: revision
        name: Bind candidate and base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          head="$(git -C candidate rev-parse HEAD)"
          base="${EVENT_BASE:-$(git -C candidate rev-parse HEAD^)}"
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base" != 0000000000000000000000000000000000000000 ]]
          git -C candidate merge-base --is-ancestor "$base" "$head"
          policy="$base"
          if [[ "$BOOTSTRAP" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
            policy="$head"
          fi
          printf 'base=%s\nhead=%s\npolicy=%s\n' "$base" "$head" "$policy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: trusted
          ref: ${{ steps.revision.outputs.policy }}
          persist-credentials: false
      - name: Plan with base policy
        env:
          BASE: ${{ steps.revision.outputs.base }}
          HEAD: ${{ steps.revision.outputs.head }}
        run: |
          set -euo pipefail
          node trusted/scripts/ci/plan.ts \
            --root "$GITHUB_WORKSPACE/candidate" --base "$BASE" --head "$HEAD" \
            --policy-root "$GITHUB_WORKSPACE/trusted" \
            --output "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: trusted
          ref: ${{ needs.plan.outputs.policy }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verification-plan
          path: ${{ runner.temp }}/verification
      - name: Execute native checks
        run: |
          sudo -n env CI=true GITHUB_ACTIONS=true PATH="$PATH" \
            "$(command -v node)" trusted/scripts/ci/isolate.ts \
            --root "$GITHUB_WORKSPACE/candidate" --trusted "$GITHUB_WORKSPACE/trusted" \
            --plan "$RUNNER_TEMP/verification/plan.json" --platform x86_64-linux \
            --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-x86_64-linux
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14

  darwin:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: trusted
          ref: ${{ needs.plan.outputs.policy }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verification-plan
          path: ${{ runner.temp }}/verification
      - name: Execute native checks
        run: |
          sudo -n env CI=true GITHUB_ACTIONS=true PATH="$PATH" \
            "$(command -v node)" trusted/scripts/ci/isolate.ts \
            --root "$GITHUB_WORKSPACE/candidate" --trusted "$GITHUB_WORKSPACE/trusted" \
            --plan "$RUNNER_TEMP/verification/plan.json" --platform aarch64-darwin \
            --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-aarch64-darwin
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14

  merge-ready:
    needs: [plan, linux, darwin]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.policy }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verification-plan
          path: ${{ runner.temp }}/verification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/evidence
      - name: Reject incomplete evidence
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          for platform in aarch64-darwin x86_64-linux; do
            cp "$RUNNER_TEMP/evidence/evidence-$platform/receipt.json" "$RUNNER_TEMP/receipts/$platform.json"
          done
          conclusions="$(jq -c 'with_entries(.value = .value.result)' <<< "$JOBS")"
          node scripts/ci/gate.ts --plan "$RUNNER_TEMP/verification/plan.json" \
            --receipts "$RUNNER_TEMP/receipts" --jobs "$conclusions" \
            --summary "$RUNNER_TEMP/merge-ready.md"
      - name: Publish coverage
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/merge-ready.md" ]]; then
            cat "$RUNNER_TEMP/merge-ready.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'merge-ready failed before evidence could be aggregated.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
